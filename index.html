<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Factory Pro - 생산 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBNQ61kVHAlun_MXJllGxIMBiZ9y-s-Sk",
            authDomain: "smart-factory-d9494.firebaseapp.com",
            projectId: "smart-factory-d9494",
            storageBucket: "smart-factory-d9494.firebasestorage.app",
            messagingSenderId: "750392341104",
            appId: "1:750392341104:web:06da1f06cf52ada2807ab5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Expose Firebase tools to global scope for the app logic
        window.db = db;
        window.firebaseModules = { collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot };
        window.isFirebaseConnected = true;
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Top Navigation & Status -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-xl text-white">
                <i class="fa-solid fa-industry text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">Smart Factory Pro</h1>
                <p class="text-xs text-slate-400">생산 공정 및 재고 통합 관리 시스템</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div id="sync-status" class="flex items-center space-x-2 bg-emerald-950/60 border border-emerald-600/50 px-3 py-1.5 rounded-full text-xs font-medium text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>실시간 연동됨</span>
            </div>
            <div class="text-xs text-slate-400">
                <i class="fa-regular fa-clock mr-1"></i><span id="current-time"></span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
        <!-- Dashboard Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">총 오더 건수</p>
                    <h3 id="stat-total" class="text-2xl font-bold mt-1 text-white">0건</h3>
                </div>
                <div class="bg-blue-500/10 text-blue-400 p-3 rounded-xl">
                    <i class="fa-solid fa-clipboard-list text-lg"></i>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">진행 중 공정</p>
                    <h3 id="stat-progress" class="text-2xl font-bold mt-1 text-amber-400">0건</h3>
                </div>
                <div class="bg-amber-500/10 text-amber-400 p-3 rounded-xl">
                    <i class="fa-solid fa-gears text-lg"></i>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">완료된 생산</p>
                    <h3 id="stat-completed" class="text-2xl font-bold mt-1 text-emerald-400">0건</h3>
                </div>
                <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-xl">
                    <i class="fa-solid fa-circle-check text-lg"></i>
                </div>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">시스템 상태</p>
                    <h3 class="text-lg font-bold mt-1 text-emerald-400 flex items-center"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Cloud Sync</h3>
                </div>
                <div class="bg-purple-500/10 text-purple-400 p-3 rounded-xl">
                    <i class="fa-solid fa-database text-lg"></i>
                </div>
            </div>
        </div>

        <!-- Control Bar & Order Registration -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="오더명, 품번 또는 거래처 검색..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <button onclick="openOrderModal()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>신규 생산 오더 등록</span>
            </button>
        </div>

        <!-- Orders Table Section -->
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                <h2 class="font-bold text-base text-white">실시간 생산 공정 현황</h2>
                <span class="text-xs text-slate-400">* Firebase Firestore 실시간 동기화 적용됨</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="py-3 px-6">오더 번호 / 품명</th>
                            <th class="py-3 px-6">거래처</th>
                            <th class="py-3 px-6">수량</th>
                            <th class="py-3 px-6">현재 공정 단계</th>
                            <th class="py-3 px-6">등록일시</th>
                            <th class="py-3 px-6 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body" class="divide-y divide-slate-700/60 text-sm">
                        <tr>
                            <td colspan="6" class="text-center py-12 text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-500 block"></i>
                                데이터 불러오는 중...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Order Modal -->
    <div id="order-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/40">
                <h3 class="font-bold text-white text-base">신규 생산 오더 등록</h3>
                <button onclick="closeOrderModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="order-form" onsubmit="handleOrderSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">품명 / 오더명</label>
                    <input type="text" id="modal-product" required placeholder="예: 알루미늄 베드 가공품" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">거래처</label>
                    <input type="text" id="modal-client" required placeholder="예: OO정밀" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">생산 수량</label>
                    <input type="number" id="modal-quantity" required min="1" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">초기 공정 단계</label>
                    <select id="modal-stage" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                        <option value="자재 발주">1단계: 자재 발주</option>
                        <option value="가공 준비">2단계: 가공 준비</option>
                        <option value="정밀 가공">3단계: 정밀 가공</option>
                        <option value="품질 검사">4단계: 품질 검사</option>
                        <option value="포장 및 출하">5단계: 포장 및 출하</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeOrderModal()" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/20">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

    <!-- Application Core Script -->
    <script>
        let ordersData = [];

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Real-time Firestore Listener
        window.addEventListener('load', () => {
            const checkFirebaseInterval = setInterval(() => {
                if (window.db && window.firebaseModules) {
                    clearInterval(checkFirebaseInterval);
                    initFirestoreListener();
                }
            }, 200);
        });

        function initFirestoreListener() {
            const { collection, onSnapshot } = window.firebaseModules;
            onSnapshot(collection(window.db, "orders"), (snapshot) => {
                ordersData = [];
                snapshot.forEach((doc) => {
                    ordersData.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
                updateStats();
            }, (error) => {
                console.error("Firestore Error: ", error);
                showToast("데이터 연동 중 오류가 발생했습니다.", "bg-rose-900 border-rose-600 text-rose-200", "fa-triangle-exclamation");
            });
        }

        function renderTable() {
            const tbody = document.getElementById('order-table-body');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = ordersData.filter(o => 
                (o.product && o.product.toLowerCase().includes(searchVal)) ||
                (o.client && o.client.toLowerCase().includes(searchVal))
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-400">등록된 생산 오더가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(o => `
                <tr class="hover:bg-slate-700/30 transition-colors">
                    <td class="py-3.5 px-6 font-medium text-white">
                        <div>${o.product || '-'}</div>
                        <div class="text-xs text-slate-400 font-mono">ID: ${o.id.substring(0,6)}...</div>
                    </td>
                    <td class="py-3.5 px-6 text-slate-300">${o.client || '-'}</td>
                    <td class="py-3.5 px-6 text-slate-300 font-semibold">${o.quantity || 0} EA</td>
                    <td class="py-3.5 px-6">
                        <select onchange="updateStage('${o.id}', this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                            <option value="자재 발주" ${o.stage === '자재 발주' ? 'selected' : ''}>1단계: 자재 발주</option>
                            <option value="가공 준비" ${o.stage === '가공 준비' ? 'selected' : ''}>2단계: 가공 준비</option>
                            <option value="정밀 가공" ${o.stage === '정밀 가공' ? 'selected' : ''}>3단계: 정밀 가공</option>
                            <option value="품질 검사" ${o.stage === '품질 검사' ? 'selected' : ''}>4단계: 품질 검사</option>
                            <option value="포장 및 출하" ${o.stage === '포장 및 출하' ? 'selected' : ''}>5단계: 포장 및 출하</option>
                        </select>
                    </td>
                    <td class="py-3.5 px-6 text-xs text-slate-400">${o.createdAt ? new Date(o.createdAt).toLocaleString() : '-'}</td>
                    <td class="py-3.5 px-6 text-center">
                        <button onclick="deleteOrder('${o.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 p-2 rounded-lg text-xs transition-colors" title="삭제">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = ordersData.length + '건';
            const progressCount = ordersData.filter(o => o.stage !== '포장 및 출하').length;
            const completedCount = ordersData.filter(o => o.stage === '포장 및 출하').length;
            document.getElementById('stat-progress').innerText = progressCount + '건';
            document.getElementById('stat-completed').innerText = completedCount + '건';
        }

        document.getElementById('search-input').addEventListener('input', renderTable);

        function openOrderModal() {
            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
            document.getElementById('order-form').reset();
        }

        async function handleOrderSubmit(e) {
            e.preventDefault();
            const product = document.getElementById('modal-product').value;
            const client = document.getElementById('modal-client').value;
            const quantity = parseInt(document.getElementById('modal-quantity').value);
            const stage = document.getElementById('modal-stage').value;

            try {
                const { collection, addDoc } = window.firebaseModules;
                await addDoc(collection(window.db, "orders"), {
                    product, client, quantity, stage, createdAt: new Date().toISOString()
                });
                closeOrderModal();
                showToast("생산 오더가 정상적으로 등록되었습니다.", "bg-emerald-950 border-emerald-600 text-emerald-200", "fa-circle-check");
            } catch (err) {
                console.error(err);
                showToast("등록 실패: 권한 또는 네트워크를 확인하세요.", "bg-rose-950 border-rose-600 text-rose-200", "fa-triangle-exclamation");
            }
        }

        async function updateStage(id, newStage) {
            try {
                const { doc, updateDoc } = window.firebaseModules;
                await updateDoc(doc(window.db, "orders", id), { stage: newStage });
                showToast("공정 단계가 변경되었습니다.", "bg-blue-950 border-blue-600 text-blue-200", "fa-rotate");
            } catch (err) {
                console.error(err);
                showToast("상태 변경 실패", "bg-rose-950 border-rose-600 text-rose-200", "fa-triangle-exclamation");
            }
        }

        async function deleteOrder(id) {
            if (!confirm("정말 이 오더를 삭제하시겠습니까?")) return;
            try {
                const { doc, deleteDoc } = window.firebaseModules;
                await deleteDoc(doc(window.db, "orders", id));
                showToast("오더가 삭제되었습니다.", "bg-amber-950 border-amber-600 text-amber-200", "fa-trash-can");
            } catch (err) {
                console.error(err);
                showToast("삭제 실패", "bg-rose-950 border-rose-600 text-rose-200", "fa-triangle-exclamation");
            }
        }

        function showToast(message, bgColor, icon) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `${bgColor} px-4 py-3 rounded-xl shadow-lg border flex items-center space-x-3 text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
