<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제조업 생산 관리 프로그램</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col font-sans antialiased overflow-x-hidden">

    <!-- Top Navigation -->
    <header class="bg-indigo-900 text-white shadow-md flex-shrink-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-800 p-2 rounded-lg text-indigo-200">
                    <i class="fa-solid fa-industry text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">Smart Factory Pro</h1>
                    <p class="text-xs text-indigo-300">생산 관리 및 공정 통합 시스템</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span id="sync-status" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> 실시간 연동됨
                </span>
                <span class="text-xs text-indigo-200 hidden sm:inline" id="current-time"></span>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 hidden md:flex">
            <nav class="p-4 space-y-1">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors bg-indigo-50 text-indigo-700">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    <span>대시보드</span>
                </button>
                <button onclick="switchTab('orders')" id="nav-orders" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50">
                    <i class="fa-solid fa-list-check w-5"></i>
                    <span>생산 오더 관리</span>
                </button>
                <button onclick="switchTab('inventory')" id="nav-inventory" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50">
                    <i class="fa-solid fa-boxes-stacked w-5"></i>
                    <span>자재 및 재고 관리</span>
                </button>
            </nav>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-100" id="main-content">
            <!-- Dynamic tab views will render here -->
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <script>
        // Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyBNQ61kVHAlun_MXJllGxIMBiZ9y-s-Sk",
            authDomain: "smart-factory-d9494.firebaseapp.com",
            projectId: "smart-factory-d9494",
            storageBucket: "smart-factory-d9494.firebasestorage.app",
            messagingSenderId: "750392341104",
            appId: "1:750392341104:web:06da1f06cf52ada2807ab5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentTab = 'dashboard';
        let ordersData = [];
        let inventoryData = [];

        // Clock Update
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
            const el = document.getElementById('current-time');
            if (el) el.innerText = timeStr;
        }, 1000);

        // Firestore Real-time Listeners
        window.onload = function() {
            db.collection("orders").onSnapshot((snapshot) => {
                ordersData = [];
                snapshot.forEach((doc) => {
                    ordersData.push({ id: doc.id, ...doc.data() });
                });
                if (currentTab === 'dashboard' || currentTab === 'orders') {
                    renderCurrentTab();
                }
            }, (error) => {
                console.error("Orders sync error:", error);
            });

            db.collection("inventory").onSnapshot((snapshot) => {
                inventoryData = [];
                snapshot.forEach((doc) => {
                    inventoryData.push({ id: doc.id, ...doc.data() });
                });
                if (currentTab === 'dashboard' || currentTab === 'inventory') {
                    renderCurrentTab();
                }
            }, (error) => {
                console.error("Inventory sync error:", error);
            });

            renderCurrentTab();
        };

        function switchTab(tabName) {
            currentTab = tabName;
            ['dashboard', 'orders', 'inventory'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tabName) {
                        btn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors bg-indigo-50 text-indigo-700";
                    } else {
                        btn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors text-slate-600 hover:bg-slate-50";
                    }
                }
            });
            renderCurrentTab();
        }

        function renderCurrentTab() {
            const container = document.getElementById('main-content');
            if (currentTab === 'dashboard') {
                container.innerHTML = getDashboardHTML();
            } else if (currentTab === 'orders') {
                container.innerHTML = getOrdersHTML();
                loadInitialData();
            } else if (currentTab === 'inventory') {
                container.innerHTML = getInventoryHTML();
                loadInventoryData();
            }
        }

        function getDashboardHTML() {
            const totalOrders = ordersData.length;
            const inProgress = ordersData.filter(o => o.stage !== '포장 및 출하').length;
            const completed = ordersData.filter(o => o.stage === '포장 및 출하').length;
            const lowStock = inventoryData.filter(i => (i.stock || 0) <= (i.minStock || 10)).length;

            return `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-slate-800">생산 종합 대시보드</h2>
                        <button onclick="switchTab('orders')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">오더 관리 바로가기</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm font-medium text-slate-500">전체 오더</p>
                            <h3 class="text-3xl font-bold mt-2 text-slate-900">${totalOrders}건</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm font-medium text-slate-500">진행 중 공정</p>
                            <h3 class="text-3xl font-bold mt-2 text-indigo-600">${inProgress}건</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm font-medium text-slate-500">완료된 생산</p>
                            <h3 class="text-3xl font-bold mt-2 text-emerald-600">${completed}건</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm font-medium text-slate-500">자재 부족 경고</p>
                            <h3 class="text-3xl font-bold mt-2 text-rose-600">${lowStock}건</h3>
                        </div>
                    </div>
                </div>
            `;
        }

        function getOrdersHTML() {
            return `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 class="text-xl font-bold text-slate-800">생산 오더 관리</h2>
                        <button onclick="openOrderModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i><span>신규 오더 등록</span>
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold border-b border-slate-200">
                                        <th class="py-3 px-6">품명 / 오더명</th>
                                        <th class="py-3 px-6">거래처</th>
                                        <th class="py-3 px-6">수량</th>
                                        <th class="py-3 px-6">공정 단계</th>
                                        <th class="py-3 px-6 text-center">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="order-table-body" class="divide-y divide-slate-200 text-sm">
                                    <tr><td colspan="5" class="text-center py-8 text-slate-400">데이터 불러오는 중...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function getInventoryHTML() {
            return `
                <div class="space-y-6 max-w-7xl mx-auto">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 class="text-xl font-bold text-slate-800">자재 및 재고 관리</h2>
                        <button onclick="openInventoryModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i><span>신규 자재 등록</span>
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold border-b border-slate-200">
                                        <th class="py-3 px-6">자재명</th>
                                        <th class="py-3 px-6">규격</th>
                                        <th class="py-3 px-6">현재 재고</th>
                                        <th class="py-3 px-6 text-center">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="inventory-table-body" class="divide-y divide-slate-200 text-sm">
                                    <tr><td colspan="4" class="text-center py-8 text-slate-400">데이터 불러오는 중...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function loadInitialData() {
            const tbody = document.getElementById('order-table-body');
            if (!tbody) return;
            if (ordersData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">등록된 생산 오더가 없습니다.</td></tr>`;
                return;
            }
            tbody.innerHTML = ordersData.map(o => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-4 px-6 font-medium text-slate-900">${o.product || '-'}</td>
                    <td class="py-4 px-6 text-slate-600">${o.client || '-'}</td>
                    <td class="py-4 px-6 text-slate-600">${o.quantity || 0} EA</td>
                    <td class="py-4 px-6">
                        <select onchange="updateOrderStatus('${o.id}', this.value)" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-xs font-medium text-slate-700 focus:outline-none focus
